# Blank lines start a new paragraph.
why = """
Recipe sites vanish, move behind paywalls or bury the recipe under a long story. And once I've changed a recipe, I want my version kept alongside the original, not scribbled in the margin.
"""

[[features]]
title = "Save from a link, or paste a whole page"
text = "Paste a URL and a background job fetches the page, pulls out the ingredients and steps, and takes a full-page snapshot. Pasting a Ctrl+A copy works too: it finds the recipe and skips the menus, ads and comments."
# screenshot = "img/projects/recipository/import.png"

[[features]]
title = "Every tweak is a new version"
text = "Editing a recipe saves the next numbered version. Version 1 is always the original, and any older version can be opened read-only from the version picker."

[[features]]
title = "Kept forever in Google Drive"
text = "One button turns each recipe into a Google Doc, with photos and full version history. Re-syncs upload only what changed."

# Shown as: **Title.** Text
[[highlights]]
title = "A job queue in Postgres"
text = "Uses FOR UPDATE SKIP LOCKED, with retries and backoff. No extra services."

[[highlights]]
title = "Safe link fetching"
text = "Blocks private addresses (even through DNS rebinding), respects robots.txt and re-checks every redirect."

[[highlights]]
title = "Accounts done properly"
text = "Argon2id passwords, server-side sessions, CSRF tokens and login rate limiting."

[[highlights]]
title = "Typed and tested"
text = "Strict mypy, pytest, and a test that fails if a page starts making extra database queries."

[[highlights]]
title = "Ships itself"
text = "Every push to main runs CI and deploys to Fly.io."

[[highlights]]
title = "Light on the page"
text = "Server-rendered HTML with HTMX and hand-written CSS, no front-end framework."

